<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kauefr.github.io</title>
  </head>
  <body>
    <p>Hello World</p>
    <script lang="js">
      function dispatchToApp(path) {
        if (path.startsWith("/apps/angular14/")) {
          fetch("/apps/angular14/index.html")
            .then((r) => (r.status === 200 ? r : Promise.reject()))
            .then((r) => r.text())
            .then((html) => {
              document.open();
              document.write(html);
              document.close();
            })
            .catch((error) => console.error(error));
        }
      }
      dispatchToApp(location.pathname);
    </script>
  </body>
</html>
