<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kauefr.github.io</title>
  </head>
  <body>
    <p>Hello World</p>
    <script>
      function fetchAndReplace(url) {
        fetch(url)
          .then((r) => (r.status === 200 ? r : Promise.reject()))
          .then((r) => r.text())
          .then((html) => {
            document.open();
            document.write(html);
            document.close();
          })
          .catch((error) => console.error(error));
      }

      function dispatchToApp(pathname) {
        const appsPaths = ["/apps/angular14/", "/apps/ts/"];

        let appPath = appsPaths.find((p) => pathname.startsWith(p));

        if (appPath) {
          fetchAndReplace(p + "index.html");
        }
      }

      dispatchToApp(location.pathname);
    </script>
  </body>
</html>
